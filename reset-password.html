<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Нууц үг шинэчлэх — Azwell.mn</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Segoe UI',Arial,sans-serif;
    background:linear-gradient(135deg,#eaf4f8 0%,#d4ecf2 100%);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    color:#1a2e38;
  }
  .card {
    background:#fff;
    border-radius:14px;
    padding:36px 32px;
    width:100%;
    max-width:420px;
    box-shadow:0 8px 32px rgba(20,40,80,.12);
  }
  .logo {
    text-align:center;
    font-size:28px;
    font-weight:800;
    color:#1a2e38;
    margin-bottom:6px;
    letter-spacing:-0.5px;
  }
  h1 {
    font-size:22px;
    margin-bottom:6px;
    color:#1a6e8a;
  }
  p.sub { color:#666; font-size:13px; margin-bottom:24px; }
  label {
    display:block;
    font-size:12px;
    font-weight:700;
    color:#555;
    margin-top:14px;
    margin-bottom:6px;
  }
  input {
    width:100%;
    padding:11px 14px;
    border:1.5px solid #ddd;
    border-radius:8px;
    font-size:14px;
    outline:none;
  }
  input:focus { border-color:#1a9eab; }
  .btn {
    background:linear-gradient(135deg,#1a6e8a,#1aaba0);
    color:#fff;
    border:none;
    padding:12px 22px;
    border-radius:8px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    width:100%;
    margin-top:18px;
  }
  .btn:hover { filter:brightness(1.07); }
  .btn:disabled { opacity:.6; cursor:not-allowed; }
  .err {
    background:#fde8e8;
    color:#b00020;
    padding:10px;
    border-radius:6px;
    font-size:13px;
    margin-top:14px;
    display:none;
  }
  .ok {
    background:#e7f6ed;
    color:#1a7a3e;
    padding:10px;
    border-radius:6px;
    font-size:13px;
    margin-top:14px;
    display:none;
  }
  .center {
    text-align:center;
    margin-top:18px;
  }
  .center a {
    color:#1a6e8a;
    text-decoration:none;
    font-weight:600;
    font-size:13px;
  }
  .center a:hover { text-decoration:underline; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">azwell.mn</div>
    <h1>🔑 Нууц үг шинэчлэх</h1>
    <p class="sub">Шинэ нууц үгээ оруулна уу. Хадгалмагц бүх төхөөрөмжөөс гарна.</p>

    <form id="resetForm">
      <label>Шинэ нууц үг (6+ тэмдэгт)</label>
      <input name="new_password" type="password" required minlength="6" autocomplete="new-password">
      <label>Дахин оруулах</label>
      <input name="confirm_password" type="password" required minlength="6">
      <div class="err" id="err"></div>
      <div class="ok"  id="ok"></div>
      <button class="btn" type="submit" id="submitBtn">Нууц үг хадгалах</button>
    </form>

    <div class="center">
      <a href="/">← Нүүр хуудас руу буцах</a>
    </div>
  </div>

<script>
(function(){
  'use strict';

  const params = new URLSearchParams(location.search);
  const token  = params.get('token');
  const err    = document.getElementById('err');
  const ok     = document.getElementById('ok');
  const submitBtn = document.getElementById('submitBtn');

  if (!token) {
    err.textContent = '⚠️ Линк буруу эсвэл хүчингүй. Дахин сэргээх хүсэлт илгээнэ үү.';
    err.style.display = 'block';
    submitBtn.disabled = true;
    return;
  }

  document.getElementById('resetForm').addEventListener('submit', async function(e){
    e.preventDefault();
    err.style.display = 'none';
    ok.style.display = 'none';
    const fd = new FormData(e.target);
    const newPwd = fd.get('new_password');
    const confirm = fd.get('confirm_password');
    if (newPwd !== confirm) {
      err.textContent = '⚠️ 2 нууц үг таарахгүй байна';
      err.style.display = 'block';
      return;
    }
    submitBtn.disabled = true;
    submitBtn.textContent = 'Уншиж байна...';
    try {
      const r = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: token, new_password: newPwd })
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Алдаа гарлаа');
      ok.innerHTML = '✅ Нууц үг амжилттай шинэчлэгдлээ!<br>3 секундын дараа нүүр хуудас руу шилжинэ...';
      ok.style.display = 'block';
      submitBtn.style.display = 'none';
      setTimeout(function(){ location.href = '/'; }, 3000);
    } catch (ex) {
      err.textContent = '⚠️ ' + ex.message;
      err.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Нууц үг хадгалах';
    }
  });
})();
</script>
</body>
</html>
